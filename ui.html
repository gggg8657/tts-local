<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tts-local</title>
<style>
  :root{--bg:#fafaf8;--fg:#1f1f1f;--muted:#777;--line:#ddd;--acc:#2f6fed}
  body{font:15px/1.65 -apple-system,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:900px;margin:0 auto;padding:20px 16px;overflow-wrap:anywhere}
  h1{font-size:20px;margin:0 0 4px}h1 small{font-weight:400;color:var(--muted);font-size:13px}
  textarea{width:100%;height:220px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;box-sizing:border-box;background:#fff;resize:vertical}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
  select,button,input[type=range]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
  button.primary{background:var(--acc);color:#fff;border-color:var(--acc);padding:6px 22px;cursor:pointer}button:disabled{opacity:.5}
  #status{color:var(--muted);font-size:13px}
  audio{width:100%;margin-top:10px}
  #runs{font-size:13px}#runs li{cursor:pointer;padding:3px 0;list-style:none}#runs li:hover{color:var(--acc)}
  details{margin-top:14px}summary{cursor:pointer;color:var(--muted);font-size:13px}
  pre{white-space:pre-wrap;background:#f1f1ee;padding:12px;border-radius:6px;font-size:13px}
</style>

<h1>tts-local <small>— 한국어 로컬 TTS (MeloTTS) · OpenAI /v1/audio/speech 호환</small></h1>
<textarea id="in" placeholder="읽을 글을 붙여넣으세요. 문장 단위로 나눠 합성합니다.">2026년 10월 4일 KAERI 회의를 시작하겠습니다. 오늘 안건은 세 가지입니다.</textarea>
<div class="bar">
  <label>목소리 <select id="voice"></select></label>
  <label>속도 <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1"> <span id="spv">1.0</span></label>
  <label>형식 <select id="fmt"><option>wav<option>mp3</select></label>
  <button id="go" class="primary">합성</button>
  <a id="dl" hidden download>⬇ 내려받기</a>
  <span id="status"></span>
</div>
<audio id="player" controls hidden></audio>

<details open><summary>API</summary><pre>curl localhost:8771/v1/audio/speech -H 'Content-Type: application/json' \
  -d '{"model":"melo","input":"안녕하세요","voice":"KR","response_format":"mp3","speed":1.0}' -o a.mp3</pre></details>
<details><summary>이전 합성 기록</summary><ul id="runs"></ul></details>

<script>
const $ = id => document.getElementById(id);
const VOICE_DEFAULT = %VOICE%;
fetch('api/voices').then(r => r.json()).then(j => {
  $('voice').innerHTML = j.voices.map(v => `<option ${v === VOICE_DEFAULT ? 'selected' : ''}>${v}</option>`).join('');
}).catch(() => $('status').textContent = '엔진 로드 실패 (server.log 확인)');
$('speed').oninput = () => $('spv').textContent = Number($('speed').value).toFixed(1);

function show(m) {
  const url = `/audio/${m.run_id}.${m.format}`;
  $('player').src = url; $('player').hidden = false; $('player').play().catch(() => {});
  $('dl').href = url; $('dl').download = `${m.run_id}.${m.format}`; $('dl').hidden = false;
  $('status').textContent = `완료 · ${m.seconds}초 분량`;
}
async function loadRuns() {
  const rs = await fetch('api/runs').then(r => r.json());
  $('runs').innerHTML = rs.map(r => `<li data-id="${r.run_id}" data-f="${r.format}">${r.ts} · ${r.voice} · ${r.seconds}s · ${r.text.slice(0, 40).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}…</li>`).join('') || '<li>없음</li>';
  $('runs').querySelectorAll('li[data-id]').forEach(li => li.onclick = () => {
    const r = rs.find(x => x.run_id === li.dataset.id); $('in').value = r.text; show(r);
  });
}
loadRuns();
$('go').onclick = async () => {
  const text = $('in').value.trim(); if (!text) return;
  $('go').disabled = true; $('status').textContent = '합성 중 — 첫 호출은 모델 로드로 수십 초';
  try {
    const r = await fetch('api/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, voice: $('voice').value, speed: Number($('speed').value), format: $('fmt').value }) });
    const j = await r.json(); if (j.error) throw new Error(j.error.message || j.error);
    show(j); loadRuns();
  } catch (e) { $('status').textContent = '오류: ' + e.message; }
  $('go').disabled = false;
};
</script>
